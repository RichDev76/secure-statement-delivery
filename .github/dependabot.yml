version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /statement-service/docker
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /config-server/docker
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
