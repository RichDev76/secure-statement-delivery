name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check formatting (direct goal — apply never fires, see ADR 0024 D2)
        run: ./mvnw -B -ntp spotless:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package
        run: ./mvnw -B -ntp -DskipTests -Dspotless.skip=true package
      - name: Upload jars
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-jars
          path: '**/target/*.jar'
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run unit tests
        run: ./mvnw -B -ntp -Dspotless.skip=true test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Pre-pull Testcontainers images
        run: |
          for image in postgres:18-alpine floci/floci:1.5.33-compat redis:8-alpine; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              echo "::warning::pull of $image failed (attempt $attempt)"; sleep $((attempt * 10))
            done
          done
      - name: Run full verify (unit + integration)
        run: ./mvnw -B -ntp -Dspotless.skip=true verify
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/'
          retention-days: 7
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: statement-service/target/site/jacoco/
          retention-days: 7

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Populate local Maven cache
        run: ./mvnw -B -ntp -q dependency:resolve dependency:resolve-plugins
      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy's Java scanner resolves POM parents/BOMs against Maven Central unless
          # forced offline; unauthenticated shared-runner IPs hit its 429 rate limit.
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret
          trivyignores: .trivyignore

  api-compat:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          curl -sSL -o oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
      - name: Check OpenAPI backward compatibility
        env:
          SPEC: statement-service/src/main/resources/openapi/statement-service-v1-openapi.yaml
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          if git cat-file -e "origin/${GITHUB_BASE_REF}:${SPEC}" 2>/dev/null; then
            git show "origin/${GITHUB_BASE_REF}:${SPEC}" > /tmp/base-spec.yaml
            oasdiff breaking /tmp/base-spec.yaml "$SPEC" --fail-on ERR
          else
            echo "::notice::Contract absent on base branch (new or renamed contract) — skipping breaking-change check"
          fi
