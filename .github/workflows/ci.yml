name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check formatting (direct goal — apply never fires, see ADR 0024 D2)
        run: ./mvnw -B -ntp spotless:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package
        run: ./mvnw -B -ntp -DskipTests -Dspotless.skip=true package
      - name: Upload jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jars
          path: '**/target/*.jar'
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run unit tests
        run: ./mvnw -B -ntp -Dspotless.skip=true test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Pre-pull Testcontainers images
        run: |
          for image in postgres:18-alpine floci/floci:1.5.33-compat redis:8-alpine; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              echo "::warning::pull of $image failed (attempt $attempt)"; sleep $((attempt * 10))
            done
          done
      - name: Run full verify (unit + integration)
        run: ./mvnw -B -ntp -Dspotless.skip=true verify
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/'
          retention-days: 7
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: statement-service/target/site/jacoco/
          retention-days: 7

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Populate local Maven cache
        run: ./mvnw -B -ntp -q dependency:resolve dependency:resolve-plugins
      - name: Trivy vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy's Java scanner resolves POM parents/BOMs against Maven Central unless
          # forced offline; unauthenticated shared-runner IPs hit its 429 rate limit.
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret
          trivyignores: .trivyignore

  api-compat:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          curl -sSL -o oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
      - name: Check OpenAPI backward compatibility
        env:
          SPEC: statement-service/src/main/resources/openapi/statement-service-v1-openapi.yaml
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          if git cat-file -e "origin/${GITHUB_BASE_REF}:${SPEC}" 2>/dev/null; then
            git show "origin/${GITHUB_BASE_REF}:${SPEC}" > /tmp/base-spec.yaml
            oasdiff breaking /tmp/base-spec.yaml "$SPEC" --fail-on ERR
          else
            echo "::notice::Contract absent on base branch (new or renamed contract) — skipping breaking-change check"
          fi

  api-regression:
    name: API regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@4.0.0
      - name: Generate ephemeral environment
        working-directory: infra
        run: |
          cp .env.example .env
          # Blank secrets in .env.example carry trailing "# Generate:" comments,
          # so match "VAR=" optionally followed by whitespace and a comment.
          while IFS= read -r var; do
            case "$var" in
              # Base64-decoded by the app (MasterKeyProvider): must be real base64 of 32 bytes.
              STATEMENT_*) value="$(openssl rand -base64 32)" ;;
              *) value="$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-32)" ;;
            esac
            echo "::add-mask::$value"
            sed -i "s|^${var}=.*|${var}=${value}|" .env
          done < <(grep -E '^[A-Z_0-9]+=[[:space:]]*(#.*)?$' .env.example | cut -d= -f1)
      - name: Bootstrap and start stack
        working-directory: infra
        run: ./bootstrap_all.sh
      - name: Wait for service health
        run: |
          for i in $(seq 1 60); do
            state="$(curl -fsS http://localhost:8080/api/v1/statements/actuator/health 2>/dev/null | jq -r .status || echo DOWN)"
            if [ "$state" = "UP" ]; then
              echo "Service healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Service did not become healthy within 300s"
          exit 1
      - name: Run Bruno API regression pack
        working-directory: statement-service/bruno/Statement Service V1
        run: |
          ADMIN_CLIENT_SECRET="$(grep '^KEYCLOAK_ADMIN_CLIENT_SECRET=' "$GITHUB_WORKSPACE/infra/.env" | cut -d= -f2-)"
          CONSUMER_CLIENT_SECRET="$(grep '^KEYCLOAK_CONSUMER_CLIENT_SECRET=' "$GITHUB_WORKSPACE/infra/.env" | cut -d= -f2-)"
          bru run --env local \
            --env-var ADMIN_CLIENT_SECRET="$ADMIN_CLIENT_SECRET" \
            --env-var CONSUMER_CLIENT_SECRET="$CONSUMER_CLIENT_SECRET"
      - name: Collect compose logs
        if: failure()
        working-directory: infra
        run: |
          mkdir -p compose-logs
          for service in $(docker compose config --services); do
            docker compose logs --no-color "$service" > "compose-logs/${service}.log" 2>&1 || true
          done
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: infra/compose-logs/
      - name: Teardown
        if: always()
        working-directory: infra
        run: docker compose down -v

  image-build:
    name: Image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [statement-service, config-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.service }}/docker/Dockerfile -t ${{ matrix.service }}:ci .
      # Scan the shipped image, not just sources, to catch base-layer CVEs.
      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
