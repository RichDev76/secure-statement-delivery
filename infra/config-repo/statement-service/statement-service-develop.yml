server:
  port: 8080
  shutdown:
    grace-period: 30s

spring:
  config:
    activate:
      on-profile: develop
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Johannesburg
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/statement-service
  datasource:
    url: jdbc:postgresql://db:5432/statementdb?TimeZone=Africa/Johannesburg
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  jackson:
    time-zone: Africa/Johannesburg
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis

statement:
  encryption:
    algorithm: AES/GCM/NoPadding
    master-key: ${STATEMENT_MASTER_KEY}
    signature:
      secret: ${STATEMENT_SIGNATURE_SECRET}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_S3_REGION}
      endpoint: http://floci:4566
      path-style-access: true
  signed-link:
    expiry: 3m
    download-path: /api/v1/statements/download/
    # Set explicitly when behind a proxy, e.g.:
    # external-base-url: https://statements.example.com
    max-redemptions: 3
    rate-limit-per-minute: 10
    cleanup:
      enabled: true
      cron: "0 0/5 * * * *"          # every 5 minutes
      retention-period: "PT24H"      # ISO-8601 grace period after expiry so late clickers get LINK_EXPIRED, not STATEMENT_NOT_FOUND
      batch-size: 500                 # max rows to delete per run
      lock-at-most-for: "PT5M"       # ShedLock max lock time
      lock-at-least-for: "PT10S"     # ShedLock min lock time
  audit:
    partition-maintenance:
      enabled: true
      cron: "0 0 0 1 * *"            # 00:00 on the 1st of every month
      months-ahead: 2
      lock-at-most-for: "PT5M"
      lock-at-least-for: "PT10S"

logging:
  level:
    root: INFO
    com.example.statementservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /api/v1/statements/actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true

security:
  endpoints:
    # Role-gated endpoints enforced in code via @PreAuthorize (ADR 0012)
    whitelist:
      - method: GET
        pattern: /api/v1/statements/download/**
      - method: GET
        pattern: /api/v1/statements/actuator/health/**
      - method: GET
        pattern: /api/v1/statements/actuator/info
      - method: GET
        pattern: /api/v1/statements/v3/api-docs/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui.html