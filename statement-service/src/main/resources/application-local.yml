server:
  port: 8080
  shutdown:
    grace-period: 30s

spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/statement-service/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:5432/statementdb
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

statement:
  encryption:
    algorithm: AES/GCM/NoPadding
    master-key: ${STATEMENT_MASTER_KEY}
    signature:
      secret: ${STATEMENT_SIGNATURE_SECRET}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_S3_REGION}
      endpoint: http://localhost:4566
      path-style-access: true
  signed-link:
    expiry: 3m
    download-path: /api/v1/statements/download/
    max-redemptions: 3
    rate-limit-per-minute: 10
    cleanup:
      enabled: true
      cron: "0 0/5 * * * *"
      retention-period: "PT24H"
      batch-size: 500
      lock-at-most-for: "PT5M"
      lock-at-least-for: "PT10S"
  audit:
    partition-maintenance:
      enabled: true
      cron: "0 0 0 1 * *"
      months-ahead: 2
      lock-at-most-for: "PT5M"
      lock-at-least-for: "PT10S"

logging:
  level:
    root: INFO
    com.example.statementservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /api/v1/statements/actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

security:
  endpoints:
    upload:
      - method: POST
        pattern: /api/v1/statements/upload
    audit:
      - method: GET
        pattern: /api/v1/statements/audit/logs
    search:
      - method: GET
        pattern: /api/v1/statements/search
    link:
      - method: GET
        pattern: /api/v1/statements/link/**
    whitelist:
      - method: GET
        pattern: /api/v1/statements/download/**
      - method: GET
        pattern: /api/v1/statements/actuator/health/**
      - method: GET
        pattern: /api/v1/statements/actuator/info
      - method: GET
        pattern: /api/v1/statements/v3/api-docs/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui.html