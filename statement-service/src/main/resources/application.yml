spring:
  application:
    name: statement-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Ciphertext is still buffered on-heap in the S3 adapter; keep the cap small (ADR-0023).
      max-file-size: 10MB
      max-request-size: 12MB
      # Parts must spool to disk: the digest pass re-reads them via getInputStream() (ADR-0023).
      file-size-threshold: 0
  data:
    redis:
      timeout: 2s
      connect-timeout: 1s

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.statementservice: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /api/v1/statements/actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      # Redis is deliberately excluded from readiness: its outage degrades cache performance,
      # not availability, and must not pull the instance out of the load balancer.
      group:
        readiness:
          include: readinessState,db,s3
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/statements/v3/api-docs
    enabled: true
  swagger-ui:
    path: /api/v1/statements/swagger-ui/index.html
    enabled: true

