spring:
  application:
    name: statement-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0
  data:
    redis:
      timeout: 2s
      connect-timeout: 1s

server:
  port: 8080
  # Trust X-Forwarded-* for audited IPs and minted link URLs; set to none where directly exposed.
  forward-headers-strategy: framework
  tomcat:
    # Must exceed max-request-size (else Tomcat resets oversized uploads instead of returning
    # the 413 problem detail); small margin so grossly oversized bodies are cut off, not drained.
    max-swallow-size: 13MB

logging:
  level:
    root: INFO
    com.example.statementservice: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /api/v1/statements/actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      # Redis is deliberately excluded from readiness: its outage degrades cache performance,
      # not availability, and must not pull the instance out of the load balancer.
      group:
        readiness:
          include: readinessState,db,s3
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/statements/v3/api-docs
    enabled: true
  swagger-ui:
    path: /api/v1/statements/swagger-ui/index.html
    enabled: true

