spring:
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests authenticate via MockMvc jwt() post-processors.
          jwk-set-uri: http://localhost:65535/unused-in-tests
  data:
    # Overridden per-IT by AbstractIntegrationTest's @DynamicPropertySource against a real Redis
    # Testcontainer; a fallback default so @Validated context binding succeeds for any test that
    # loads the "test" profile without that dynamic override.
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

statement:
  encryption:
    algorithm: AES/GCM/NoPadding
    # Test-only AES-256 key (base64 of 32 bytes), not a real secret.
    master-key: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
    signature:
      secret: test-signature-secret
  signed-link:
    expiry: 15m
    download-path: /api/v1/statements/download/
    max-redemptions: 3
    rate-limit-per-minute: 10
    cleanup:
      # "-" disables the @Scheduled cron trigger while keeping the bean graph intact.
      cron: "-"
  audit:
    partition-maintenance:
      enabled: true
      # "-" disables the @Scheduled cron trigger while keeping the bean graph intact.
      cron: "-"
      months-ahead: 2
      lock-at-most-for: "PT5M"
      lock-at-least-for: "PT10S"
  storage:
    s3:
      # Overridden per-IT by AbstractIntegrationTest's @DynamicPropertySource against a real
      # Floci Testcontainer; these are only fallback defaults so @Validated context binding
      # succeeds for any test that loads the "test" profile without that dynamic override.
      bucket: statements
      region: us-east-1
      endpoint: http://localhost:4566
      path-style-access: true

security:
  endpoints:
    admin:
      - method: POST
        pattern: /api/v1/statements/upload
    audit:
      - method: GET
        pattern: /api/v1/statements/audit/logs
    search:
      - method: GET
        pattern: /api/v1/statements/search
    link:
      - method: GET
        pattern: /api/v1/statements/link/**
    whitelist:
      - method: GET
        pattern: /api/v1/statements/download/**
      - method: GET
        pattern: /api/v1/statements/actuator/health/**
      - method: GET
        pattern: /api/v1/statements/actuator/info
      - method: GET
        pattern: /api/v1/statements/v3/api-docs/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui/**
      - method: GET
        pattern: /api/v1/statements/swagger-ui.html
