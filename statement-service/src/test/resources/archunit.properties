# Ratchet for the hexagonal migration: legacy violations are frozen in the committed store
# and may only ever shrink. The store is deleted (and freeze() unwrapped) in Phase 7.
freeze.store.default.path=src/test/resources/frozen
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
# Target packages (statement.., audit.., shared..) do not exist until later phases.
archRule.failOnEmptyShould=false
